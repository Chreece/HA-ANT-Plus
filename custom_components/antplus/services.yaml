send_raw_control:
  name: Send raw ANT+ control
  description: Send an exactly 8-byte acknowledged ANT+ payload through the local or remote adapter that has seen the target device.
  fields:
    device_id:
      name: Device ID
      required: true
      selector: {number: {min: 0, max: 65535, mode: box}}
    device_type:
      name: Device type
      required: true
      selector: {number: {min: 0, max: 255, mode: box}}
    transmission_type:
      name: Transmission type
      required: false
      selector: {number: {min: 0, max: 255, mode: box}}
    period:
      name: Channel period
      description: ANT channel period in 1/32768-second units for this profile.
      required: true
      selector: {number: {min: 1, max: 65535, mode: box}}
    payload:
      name: Payload
      description: Exactly eight bytes as hexadecimal, for example '46FFFFFFFF015001'.
      required: true
      selector: {text: {}}
request_data_page:
  name: Request ANT+ data page
  description: Send ANT+ Common Page 70 to request a page from a known device. Uses the same confirmed local/remote transmit route as semantic controls.
  fields:
    device_id:
      name: Device ID
      required: true
      selector: {number: {min: 0, max: 65535, mode: box}}
    device_type:
      name: Device type
      required: true
      selector: {number: {min: 0, max: 255, mode: box}}
    transmission_type:
      name: Transmission type
      required: false
      selector: {number: {min: 0, max: 255, mode: box}}
    period:
      name: Channel period
      required: true
      selector: {number: {min: 1, max: 65535, mode: box}}
    page:
      name: Requested page
      required: true
      selector: {number: {min: 0, max: 255, mode: box}}
    count:
      name: Number of responses
      default: 1
      selector: {number: {min: 1, max: 127, mode: box}}
dump_diagnostics:
  name: Dump ANT+ diagnostics
  description: Log ANT+ runtime counters, timing data, queue gauges, and Python stacks for every thread. Intended for troubleshooting high CPU or stalls.
reset_diagnostics:
  name: Reset ANT+ diagnostics
  description: Reset ANT+ runtime counters and timing data before reproducing a performance problem.

send_generic_control:
  name: Send ANT+ generic control
  description: Send a documented ANT+ Generic Control menu/timer command through the local or remote adapter that has seen the target Controls device.
  fields:
    device_id:
      name: Device ID
      required: true
      selector: {number: {min: 0, max: 65535, mode: box}}
    transmission_type:
      name: Transmission type
      required: false
      selector: {number: {min: 0, max: 255, mode: box}}
    command:
      name: Command
      required: true
      selector:
        select:
          options:
            - menu_up
            - menu_down
            - select
            - back
            - home
            - timer_start
            - timer_stop
            - timer_reset
            - length
            - lap
    controller_serial:
      name: Controller serial
      description: Optional 16-bit controller identity used in Common Page 73. 65535 means unspecified.
      default: 65535
      selector: {number: {min: 0, max: 65535, mode: box}}
    controller_manufacturer_id:
      name: Controller manufacturer ID
      description: Optional ANT+ manufacturer identity. 65535 means unspecified.
      default: 65535
      selector: {number: {min: 0, max: 65535, mode: box}}
