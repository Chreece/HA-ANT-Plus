name: Hassfest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@master
        with:
          path: custom_components/antplus
