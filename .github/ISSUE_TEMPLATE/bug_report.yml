name: Bug report
description: Report a reproducible HA ANT+ problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: install-type
    attributes:
      label: Home Assistant installation type
      placeholder: HA OS, Container, Core, Supervised
  - type: input
    id: adapter
    attributes:
      label: ANT USB adapter / VID:PID
  - type: input
    id: sensor
    attributes:
      label: ANT+ sensor model
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: text
